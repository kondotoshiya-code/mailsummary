name: Mail Summary

# GitHub Actions の cron は UTC 基準。
# JST(UTC+9) の 8:00 / 12:00 / 17:00 は UTC の 23:00(前日) / 03:00 / 08:00。
on:
  schedule:
    - cron: "0 23 * * *"  # 08:00 JST（朝）
    - cron: "0 3 * * *"   # 12:00 JST（昼）
    - cron: "0 8 * * *"   # 17:00 JST（夕方）
  workflow_dispatch:       # 手動実行用
    inputs:
      lookback_hours:
        description: "何時間前まで遡って集計するか（手動テスト用）"
        required: false
        default: ""

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mail summary
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          TIMEZONE: Asia/Tokyo
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours }}
        run: python src/main.py
